# Publish @sequesign/sdk to npm (with provenance) via GitHub OIDC.
#
# THIS WORKFLOW IS FOR THE STANDALONE `Sequesign/sdk` REPOSITORY, where this
# package sits at the repo root (it is mirrored there from the Sequesign
# monorepo's packages/sequesign-sdk via `npm run sync:sdk`). The monorepo is the
# source of truth; this repo runs the release.
#
# @sequesign/sdk is the protocol's reference implementation: zero runtime deps
# (Node builtins only), TypeScript built with `npm run build` (tsc), and it
# bundles @sequesign/lib into its own dist. The published package is what
# @sequesign/mcp depends on, so this MUST publish before an MCP release.
#
# Prerequisites (see ../README.md / the monorepo's PUBLISHING notes):
#   - the `@sequesign` npm scope with npm Trusted Publishing configured for this
#     repo + workflow (Settings -> Trusted Publisher on the package). Auth is via
#     GitHub OIDC (the id-token:write permission below) — no NPM_TOKEN secret,
#     and the minted short-lived token satisfies the package's 2FA requirement;
#   - a committed package-lock.json (devDeps only) so `npm ci` is reproducible.

name: Publish SDK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # OIDC: npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # npm >= 11.5.1 for provenance / trusted publishing.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run build

      - name: Publish to npm (with provenance)
        # Auth is via npm Trusted Publishing (OIDC): the id-token:write permission
        # above lets npm mint a short-lived token at publish time, which also
        # satisfies the package's 2FA requirement. No NPM_TOKEN secret is used.
        run: npm publish --provenance --access public
